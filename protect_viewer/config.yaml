name: Protect Viewer
version: "2026.10.24-2"
slug: protect_viewer
description: Live view of UniFi Protect cameras in the Home Assistant sidebar
url: https://github.com/pcdiks/ha-protect-viewer
arch:
  - amd64
init: false
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: Cameras
panel_admin: false
ports:
  8555/tcp: 8555
  8555/udp: 8555
ports_description:
  8555/tcp: WebRTC (TCP)
  8555/udp: WebRTC (UDP)
options:
  host: 192.168.254.1
  username: ""
  password: ""
  verify_ssl: false
  grid_quality: medium
  cameras: []
  webrtc_ip: ""
  log_level: info
schema:
  host: str
  username: str
  password: password
  verify_ssl: bool
  grid_quality: list(low|medium|high)
  cameras:
    - str
  webrtc_ip: str?
  log_level: list(debug|info|warning|error)
